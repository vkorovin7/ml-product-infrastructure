[project]
name = "ml-product-infrastructure"
version = "0.1.0"
description = "Учебный проект для воспроизводимой инфраструктуры ML-разработки"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.38.36",
    "mlflow==3.16.1",
    "numpy==2.2.6",
    "Pillow==11.2.1",
    "python-dotenv==1.1.0",
    "PyYAML==6.0.3",
    "torch==2.7.1",
]

[project.scripts]
ingest-cifar10 = "ml_product_infrastructure.ingest:main"
fetch-cifar10-raw = "ml_product_infrastructure.fetch_raw:main"
convert-cifar10 = "ml_product_infrastructure.convert_cifar:main"
split-cifar10 = "ml_product_infrastructure.split_dataset:main"
stats-cifar10 = "ml_product_infrastructure.compute_stats:main"
publish-cifar10 = "ml_product_infrastructure.publish_dataset:main"

[dependency-groups]
dev = [
    "mypy==1.16.1",
    "pre-commit==4.2.0",
    "ruff==0.11.13",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/ml_product_infrastructure"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "scripts"]
exclude = [".venv", "build", "dist", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [
    "(^|/)__pycache__/",
    "(^|/)\\.venv/",
    "(^|/)\\.mypy_cache/",
    "(^|/)build/",
    "(^|/)dist/",
    "(^|/)data/",
    "(^|/)artifacts/",
]

[[tool.mypy.overrides]]
module = ["ml_product_infrastructure.*", "scripts.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"
